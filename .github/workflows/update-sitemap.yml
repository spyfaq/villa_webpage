name: Update sitemap lastmod

# Keeps <lastmod> honest instead of leaving a hardcoded date to go stale.
# Only page content triggers this: availability.json changes daily and is not
# part of the page, so it must not bump lastmod. The paths filter also stops
# this workflow from re-triggering on its own sitemap commit.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "privacy.html"
      - "style.css"

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lastmod to the date of the commit that changed the page
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          sitemap = Path("sitemap.xml")
          text = sitemap.read_text(encoding="utf-8")

          pages = {
              "https://olgasluxuryvilla-corfu.com/": "index.html",
              "https://olgasluxuryvilla-corfu.com/privacy.html": "privacy.html",
          }

          for loc, source in pages.items():
              date = subprocess.run(
                  ["git", "log", "-1", "--format=%cs", "--", source],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()
              if not date:
                  continue
              # rewrite only the <lastmod> inside this URL's own <url> block
              pattern = re.compile(
                  r"(<loc>" + re.escape(loc) + r"</loc>\s*<lastmod>)[^<]*(</lastmod>)"
              )
              text, count = pattern.subn(rf"\g<1>{date}\g<2>", text)
              print(f"{source}: {date} ({count} entry updated)")

          sitemap.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet sitemap.xml; then
            echo "sitemap.xml already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap lastmod"
          git push
